# Hạ tầng dữ liệu cho pipeline phát hiện ngã FallAllD.
# Dùng: docker compose -f deploy/docker-compose.yml up -d
services:
  kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: falld-kafka
    ports:
      - "9094:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9094
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic wearable.fall.v1 --partitions 1 --replication-factor 1 >/dev/null 2>&1 && kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  postgres:
    image: postgres:16-alpine
    container_name: falld-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: falldetect
      POSTGRES_USER: falld
      POSTGRES_PASSWORD: fall_dev_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falld -d falldetect"]
      interval: 5s
      timeout: 5s
      retries: 12

  grafana:
    image: grafana/grafana:11.2.0
    container_name: falld-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/fall-dashboard.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

  spark:
    image: apache/spark:3.5.3
    container_name: falld-spark
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - --master
      - local[*]
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.postgresql:postgresql:42.7.4
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --conf
      - spark.sql.shuffle.partitions=1
      - --conf
      - spark.sql.session.timeZone=UTC
      - /opt/project/spark/aggregate_fall_stream.py
      - --broker
      - kafka:29092
      - --topic
      - wearable.fall.v1
      - --window
      - 2 seconds
      - --watermark
      - 5 seconds
      - --window-samples
      - "200"
      - --checkpoint-location
      - /opt/project/checkpoints/spark-fall
      - --postgres-url
      - jdbc:postgresql://postgres:5432/falldetect
      - --metrics-host
      - 0.0.0.0
      - --metrics-port
      - "9096"
    environment:
      FALL_DB_PASSWORD: fall_dev_password
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ../:/opt/project
    working_dir: /opt/project
    ports:
      - "127.0.0.1:4041:4040"
    expose:
      - "9096"
    restart: unless-stopped

volumes:
  kafka-data:
  postgres-data:
