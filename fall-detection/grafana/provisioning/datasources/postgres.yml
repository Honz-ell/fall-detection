    uid: fall-pg
    type: postgres
    access: proxy
    url: postgres:5432
    user: falld
    database: falldetect
    isDefault: true
    editable: false
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
